<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">My Tasks</h1>
                <p class="header-subtitle">Stay organized and productive</p>
            </div>
            <div class="theme-toggle">
                <button id="themeBtn" class="theme-btn" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <div class="input-controls">
                        <select id="prioritySelect" class="priority-select">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                        <input type="date" id="dueDateInput" class="due-date-input">
                        <button id="addBtn" class="add-btn" title="Add task">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">
                        <i class="fas fa-list"></i> All
                    </button>
                    <button class="filter-btn" data-filter="active">
                        <i class="fas fa-check-circle"></i> Active
                    </button>
                    <button class="filter-btn" data-filter="completed">
                        <i class="fas fa-clipboard-check"></i> Completed
                    </button>
                    <button class="filter-btn" data-filter="high">
                        <i class="fas fa-exclamation-circle"></i> High Priority
                    </button>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search tasks...">
                </div>
            </section>

            <!-- Stats Section -->
            <section class="stats-section">
                <div class="stat-card">
                    <i class="fas fa-tasks"></i>
                    <div class="stat-content">
                        <p class="stat-label">Total Tasks</p>
                        <p class="stat-value" id="totalCount">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check"></i>
                    <div class="stat-content">
                        <p class="stat-label">Completed</p>
                        <p class="stat-value" id="completedCount">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-hourglass-end"></i>
                    <div class="stat-content">
                        <p class="stat-label">Pending</p>
                        <p class="stat-value" id="pendingCount">0</p>
                    </div>
                </div>
            </section>

            <!-- Tasks List -->
            <section class="tasks-section">
                <div id="tasksList" class="tasks-list">
                    <!-- Tasks will be inserted here -->
                </div>
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h2>Delete Task?</h2>
            <p>Are you sure you want to delete this task? This action cannot be undone.</p>
            <div class="modal-buttons">
                <button id="cancelBtn" class="modal-btn cancel-btn">Cancel</button>
                <button id="confirmDeleteBtn" class="modal-btn delete-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
